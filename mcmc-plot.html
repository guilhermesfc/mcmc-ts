    const normalPdf = [];
    for (let x = -4; x <= 4; x += 0.05) {

      x: lags,
      y: acf,
      type: 'bar',
      marker: { color: 'rgba(100, 150, 200, 0.7)' },
      name: 'Autocorrelation'
    };

    Plotly.newPlot('autocorr', [acfTrace], {
      title: 'Autocorrelation Function',
      xaxis: { title: 'Lag' },
      yaxis: { title: 'ACF' }
    });
